name: Build and Push AdService

on:
  push:
    branches: [ aws-deploy ]
    paths:
      - 'src/adservice/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [ aws-deploy ]
    paths:
      - 'src/adservice/**'
      - '.github/workflows/build-and-push.yml'

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 730335212840.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: my-service

jobs:
  build-adservice:
    name: Build and Push AdService
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push AdService image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build and push the adservice image
        docker buildx build \
          --platform linux/amd64 \
          --push \
          --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:adservice-${{ env.IMAGE_TAG }} \
          --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:adservice-latest \
          --file src/adservice/Dockerfile \
          src/adservice/

    - name: Output image URI
      run: |
        echo "AdService image pushed to: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:adservice-${{ github.sha }}"
