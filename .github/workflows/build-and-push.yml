name: Build and Push All Microservices

on:
  push:
    branches: [ aws-deploy ]
    paths:
      - 'src/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [ aws-deploy ]
    paths:
      - 'src/**'
      - '.github/workflows/build-and-push.yml'

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 730335212840.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: my-service

jobs:
  build-microservices:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      env:
        AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID }} # secrets stored in github
        AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
      run: |
        aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
        aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
        aws configure set default.region $AWS_DEFAULT_REGION

    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check if Dockerfile exists
      id: dockerfile-check
      run: |
        if [ -f "src/${{ matrix.service }}/Dockerfile" ]; then
          echo "dockerfile-exists=true" >> $GITHUB_OUTPUT
          echo "Dockerfile found for ${{ matrix.service }}"
        else
          echo "dockerfile-exists=false" >> $GITHUB_OUTPUT
          echo "No Dockerfile found for ${{ matrix.service }}"
        fi

    - name: Build, tag, and push ${{ matrix.service }} image
      if: steps.dockerfile-check.outputs.dockerfile-exists == 'true'
      env:
        IMAGE_TAG: ${{ github.sha }}
        SERVICE: ${{ matrix.service }}
      run: |
        # Build and push the microservice image
        docker buildx build \
          --platform linux/amd64 \
          --push \
          --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.SERVICE }}-${{ env.IMAGE_TAG }} \
          --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.SERVICE }}-latest \
          --file src/${{ env.SERVICE }}/Dockerfile \
          src/${{ env.SERVICE }}/

    - name: Output image URI
      run: |
        echo "${{ matrix.service }} image pushed to: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}"
        echo "${{ matrix.service }} latest image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-latest"
