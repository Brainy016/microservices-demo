name: Build and Push Microservices

on:
  push:
    branches: [ aws-deploy, main ]
  pull_request:
    branches: [ aws-deploy, main ]

env:
  ECR_REPOSITORY_BASE: 730335212840.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/my-service

jobs:
  build-adservice:
    name: Build and Push AdService
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push AdService image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --push \
          --tag ${{ env.ECR_REPOSITORY_BASE }}-adservice:$IMAGE_TAG \
          --tag ${{ env.ECR_REPOSITORY_BASE }}-adservice:latest \
          --file src/adservice/Dockerfile \
          src/adservice/

    - name: Output image URI
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "AdService image pushed to: ${{ env.ECR_REPOSITORY_BASE }}-adservice:$IMAGE_TAG"
        echo "AdService latest image: ${{ env.ECR_REPOSITORY_BASE }}-adservice:latest"
