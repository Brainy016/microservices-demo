name: Build and Push Microservices

on:
  push:
    branches: 
      - main        # when code changes in main
      - aws-deploy  # when workflow is updated in aws-deploy
    paths:
      - 'src/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: 
      - main
      - aws-deploy
    paths:
      - 'src/**'
      - '.github/workflows/build-and-push.yml'

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: 730335212840.dkr.ecr.eu-north-1.amazonaws.com/my-service

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [adservice, cartservice, checkoutservice, currencyservice, emailservice, frontend, loadgenerator, paymentservice, productcatalogservice, recommendationservice, shippingservice]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main   # 👈 always build from main branch

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push ${{ matrix.service }} image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag $ECR_REGISTRY/my-service:${{ matrix.service }}-$IMAGE_TAG \
            --tag $ECR_REGISTRY/my-service:${{ matrix.service }}-latest \
            --file src/${{ matrix.service }}/Dockerfile \
            src/${{ matrix.service }}/

      - name: Output image URI
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "${{ matrix.service }} image pushed to: $ECR_REPOSITORY:${{ matrix.service }}-$IMAGE_TAG"
          echo "${{ matrix.service }} latest image: $ECR_REPOSITORY:${{ matrix.service }}-latest"
